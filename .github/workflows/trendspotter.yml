name: Trendspotter weekly email

on:
  schedule:
    - cron: "7 3 * * 5" # Friday 05:07 SAST: the weekly deep-dive, in your inbox by about 06:00
    - cron: "23 4 * * 2" # Tuesday: no API calls, only keeps the score history cache from expiring
  workflow_dispatch:
    inputs:
      mode:
        description: "Force a cadence (blank = auto: weekly, or monthly on the first Friday)"
        required: false
        type: choice
        options: ["", weekly, monthly]

permissions:
  contents: read

concurrency: trendspotter

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 3 * * 5'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: trendspotter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trendspotter/requirements.txt

      - run: pip install -r requirements.txt

      # Score history lives in the Actions cache, not in the repo, so the
      # watchlist and scores stay private. Each run restores the latest copy.
      - name: Restore score history
        uses: actions/cache/restore@v4
        with:
          path: trendspotter/state
          key: trendspotter-state-${{ github.run_id }}
          restore-keys: trendspotter-state-

      - name: Build and send report
        run: python main.py ${{ inputs.mode && format('--mode {0}', inputs.mode) || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      - name: Save score history
        uses: actions/cache/save@v4
        with:
          path: trendspotter/state
          key: trendspotter-state-${{ github.run_id }}

  # GitHub deletes cache entries not used for 7 days, which is exactly the gap
  # between Friday runs. Restoring the cache mid-week keeps it alive. Costs nothing.
  keep-history-alive:
    if: github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: trendspotter/state
          key: trendspotter-state-keepalive
          restore-keys: trendspotter-state-
